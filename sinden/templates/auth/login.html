{% extends "base.html" %}
{% from "_form_errors.html" import field %}
{% block title %}ログイン | Placaの祠{% endblock %}
{% block content %}
<h1>ログイン</h1>
<form method="post">
  {{ form.hidden_tag() }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  <button type="submit">ログイン</button>
</form>
<p><small>パスワードの再設定はできません。忘れたときは、新しく登録し直してください（これまでの記録は戻りません）。</small></p>
<p>はじめての方は <a href="{{ url_for('auth.register') }}">登録</a></p>
{% endblock %}
