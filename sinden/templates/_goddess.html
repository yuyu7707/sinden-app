{#
  女神ヴィリプラカの像（イメージ）。優先順：
  1. static/img/goddess.png（背景を透明にした写真）

{% else %}

    <g fill="url(#marble)">
      <circle cx="100" cy="66" r="13"/>
      <circle cx="100" cy="92" r="22"/>
