name: deploy

# main に入ったら、テストが通ったあと本番サーバーで deploy.sh を実行する
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# デプロイが同時に2つ走らないようにする。後から来た方は前の終了を待つ
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check format (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # つなぐ先が本当に本番サーバーかを、ホスト鍵の指紋で確かめる（公開してよい値）
          fingerprint: "SHA256:dN8hHwByhzmRtv5cyZajki2ZVYMIOzayUofYFoNJelY"
          script: bash /var/www/sinden-app/deploy.sh
